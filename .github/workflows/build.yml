name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build release APK
        run: |
          set +e
          gradle assembleRelease --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E "error:|What went wrong|Could not|FAILED|\.java:|\.xml:" -A3 build.log | head -40 | tr '\n' '|' | cut -c1-3500)
            echo "::error title=Gradle build failed::$msg"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: hartens-launcher
          path: app/build/outputs/apk/release/*.apk
