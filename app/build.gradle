plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hartens.fastlauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.hartens.fastlauncher"
        minSdk 26
        targetSdk 30
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'hartens2026'
            keyAlias 'hartens'
            keyPassword 'hartens2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Постоянный ключ: обновления ставятся поверх без удаления
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Никаких внешних библиотек: лаунчер использует только системный Android SDK.
dependencies {
}
